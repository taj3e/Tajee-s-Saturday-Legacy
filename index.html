function rumor(i){let r=S.recruits[i],team=S.team.name;let options=[`${r.n}'s teammate posts: “My boy already knows 😂” A ${team} commit replies with 👀.`,`${r.n}'s high-school coach says: “Relationships are going to matter more than people think.”`, `A booster-connected account posts: “Hearing tomorrow could be a very good day for ${team}.”`,`${r.n} follows an assistant coach from ${r.finalists[Math.floor(Math.random()*r.finalists.length)]}, then fans immediately notice.`];let x=options[Math.floor(Math.random()*options.length)];S.social.unshift(x);S.events.unshift(`${S.year} W${S.week} — Recruiting rumor: ${x}`);save();openModal(`<h2>Recruiting Breadcrumb</h2><div class="feed social">${x}</div><p class="tiny">This may be meaningful, secondhand, intentional misdirection, or nothing at all.</p>`)}
function decisionDay(i){let r=S.recruits[i];openModal(`<div class="kicker">DECISION DAY PREVIEW</div><h2>${r.n}</h2><p>${r.announce} • Scheduled Week ${r.decisionWeek}</p><div class="hatrow">${r.finalists.map(x=>`<div class="hat">${x}</div>`).join('')}</div><p class="tiny">If your school is a finalist when the decision is processed, the full hat/announcement sequence will appear after advancing the week.</p>`)}
function commitmentEvent(i){let r=S.recruits[i];if(r.commit)return;let weights=r.finalists.map(f=>{let w=1;if(f===S.team.name)w+=r.interest/45;w+=r.preds.filter(p=>p[1]===f&&p[2]==='HIGH').length*.7;return w});let total=weights.reduce((a,b)=>a+b,0),z=Math.random()*total,pick=r.finalists[0];for(let j=0;j<weights.length;j++){z-=weights[j];if(z<=0){pick=r.finalists[j];break}}r.commit=pick;r.status=pick;let culture=TEAM_MAP[pick]?.phrases||[`Go ${pick}`];let positionTag=r.p==='WR'?' #WRU':r.p==='LB'?' #LBU':r.p==='DB'||r.p==='CB'?' #DBU':'';let post=`🚨 ${stars(r.stars)} #${r.rank} ${r.p} ${r.n} has committed to ${pick}. “${culture[0]}${positionTag}”`;S.social.unshift(post);S.events.unshift(`${S.year} W${S.week} — ${r.n} committed to ${pick} after choosing from ${r.finalists.join(', ')}.`);let yours=r.finalists.includes(S.team.name);openModal(`<div class="kicker">LIVE — DECISION DAY</div><h2>${r.n}</h2><p>${r.announce}</p><div class="hatrow">${r.finalists.map(x=>`<div class="hat">${x}</div>`).join('')}</div><div class="feed hot"><b>${r.n.toUpperCase()} COMMITS TO ${pick.toUpperCase()}</b><br>${culture[0]}${positionTag}</div>${yours?`<p>${pick===S.team.name?'🔥 Your social feed is exploding. Peer-recruiting and class momentum can rise from this commitment.':'Your staff was in the final group, but the recruit chose another program.'}</p>`:''}<button class="btn primary" onclick="closeModal();tab('Social')">VIEW SOCIAL REACTION</button>`)}
function chooseTone(context='press'){openModal(`<h2>Choose Your Tone</h2><p class="sub">Tone is selected for this conversation only. Your exact quote becomes part of Coach History.</p><div class="tonegrid">${['Diplomatic','Blunt','Fiery','Reserved'].map(t=>`<button class="tone" onclick="showLines('${context}','${t}')">${t}</button>`).join('')}</div>`)}
function showLines(context,tone){let lines=toneLines[context][tone];openModal(`<h2>${tone} Response</h2><p class="tiny">Choose the exact line. Different wording can create different reactions.</p>${lines.map((l,i)=>`<button class="choice" onclick="storeQuote('${context}','${tone}',${i})">${l}</button>`).join('')}`)}
function storeQuote(context,tone,i){let line=toneLines[context][tone][i];S.quotes.unshift({year:S.year,week:S.week,context,tone,line});S.events.unshift(`${S.year} W${S.week} — ${S.coach.name} (${tone}): ${line}`);S.social.unshift(`MEDIA: ${S.coach.name} on roster movement — ${line}`);save();closeModal();render()}
function advanceWeek(){S.week++;if(S.week>15){S.week=1;S.year++}S.players.forEach(p=>{p.fatigue=Math.max(0,Math.min(100,p.fatigue+Math.floor(Math.random()*9)-3))});S.events.unshift(`${S.year} W${S.week} — Week advanced. Recruiting, roster, media and staff systems processed.`);let due=S.recruits.findIndex(r=>!r.commit&&r.decisionWeek===S.week);save();render();if(due>=0){commitmentEvent(due);save();return}if(Math.random()<.55){let r=S.recruits.filter(x=>!x.commit)[Math.floor(Math.random()*S.recruits.filter(x=>!x.commit).length)];if(r){let pred=r.preds[Math.floor(Math.random()*r.preds.length)];let x=`🔮 ${pred[0]} is sticking with ${pred[1]} for ${r.n}. Confidence: ${pred[2]}.`;S.social.unshift(x);save();openModal(`<h2>Recruiting Update</h2><div class="feed social">${x}</div><button class="choice" onclick="closeModal();chooseTone('press')">MEDIA ASKS ABOUT ROSTER MOVEMENT</button>`)}}}
function showAbout(){openModal(`<h2>Saturday Legacy v0.3</h2><p>This build expands the prototype to all <b>${TEAM_DB.length} FBS programs</b>, removes permanent media style, adds per-conversation tone + exact quote selection, program ratings, team culture phrases, recruiting predictions/rumors, decision-day commitments, social reactions, coach-owned scheme identity, and the health/fatigue/durability/toughness framework.</p><p class="tiny">Large systems such as full schedules, complete 10,000+ recruit generation, play-by-play game simulation, NIL negotiation, portal logic, CFP selection and multi-decade databases remain staged for later builds.</p>`)}
populateSchools();refreshContinue();
</script></body></html>
