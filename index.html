function formatClock(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`} function ordinal(n){return n===1?'st':n===2?'nd':n===3?'rd':'th'}

function pulseLabel(p){return p>94?'EARTHQUAKE':p>87?'DEAFENING':p>78?'ROARING':p>65?'LOUD':p>50?'ENERGIZED':'SETTLED'}

function simDrive(){let G=activeGame;if(!G||G.finished)return;let offenseUser=G.userBall,offName=offenseUser?S.teamName:G.meta.opp,defName=offenseUser?G.meta.opp:S.teamName,off=teamPower(offName),def=teamPower(defName),roadOff=offName!==G.homeTeam,pulseEffect=roadOff?Math.max(0,G.pulse-60)*.13:0,qb=offenseUser?S.roster.find(p=>p.pos==='QB'&&!p.injury):null,composure=qb?qb.ratings.Awareness:75,penaltyChance=roadOff?clamp((G.pulse-65-composure*.08)/180,0,.18):.02;let r=Math.random(),text='';if(Math.random()<penaltyChance){text=`🏟️ CROWD ERUPTS — communication breaks down. False start on ${offName}.`;G.pulse=clamp(G.pulse+5,20,100);G.clock-=30;G.plays.unshift(text)}let delta=(off-def)*.018-pulseEffect*.03+(Math.random()-.5);let scoreChance=.38+delta*.08;let points=0;if(r<scoreChance*.55)points=7;else if(r<scoreChance)points=3;else if(r>.94)points=-1;if(points===7){if(offenseUser)G.userScore+=7;else G.oppScore+=7;text=`${offName} drives for a TOUCHDOWN. ${bigPlayText(offName,G)}`;G.pulse=clamp(G.pulse+(offName===G.homeTeam?9:-10),20,100)}else if(points===3){if(offenseUser)G.userScore+=3;else G.oppScore+=3;text=`${offName} converts a field goal.`;G.pulse=clamp(G.pulse+(offName===G.homeTeam?4:-5),20,100)}else if(points===-1){text=`TURNOVER! ${defName} takes it away. ${defName===G.homeTeam?'The crowd detonates.':'The road sideline erupts as the stadium goes quiet.'}`;G.pulse=clamp(G.pulse+(defName===G.homeTeam?12:-14),20,100)}else{text=`${offName} is stopped and punts. ${roadOff&&G.pulse>80?'Crowd noise was a factor on third down.':''}`;G.pulse=clamp(G.pulse+(defName===G.homeTeam?3:-2),20,100)}G.plays.unshift(text);G.userBall=!G.userBall;G.drives++;G.clock-=90+Math.floor(Math.random()*120);if(G.clock<=0){G.quarter++;G.clock=900;if(G.quarter>4){if(G.userScore===G.oppScore){G.quarter=5;G.clock=600}else G.finished=true}}G.pulse=clamp(G.pulse+(G.basePulse-G.pulse)*.16,20,100);if(Math.random()<.055)gameInjury();renderGameModal()}

function gameInjury(){let candidates=S.roster.filter(p=>!p.injury&&p.health>80&& !['K','P'].includes(p.pos));if(!candidates.length)return;let p=pick(candidates),sev=Math.random();p.injury=sev<.7?{name:pick(['Ankle Sprain','Hamstring Strain','Shoulder Sprain']),weeks:1+Math.floor(Math.random()*3),status:'Questionable'}:{name:pick(['Knee Injury','High Ankle Sprain','Shoulder Injury']),weeks:4+Math.floor(Math.random()*7),status:'Out'};p.health=sev<.7?78:55;activeGame.plays.unshift(`MEDICAL: ${p.name} (${p.pos}) leaves with ${p.injury.name}.`)}

function decisionDayPopup(b,r,pickTeam){setTimeout(()=>openModal(`<div class="kicker">LIVE — ${r.announce.toUpperCase()}</div><h2>${r.name}</h2><p>${stars(r.star)} ${r.pos} • #${r.rank} National</p><div class="two">${b.finalists.map(f=>`<div class="card" style="text-align:center">${logoHtml(f,'oppLogo')}<br><b>${f}</b></div>`).join('')}</div><div class="feed hot"><b>${r.name.toUpperCase()} COMMITS TO ${pickTeam.toUpperCase()}</b><br>${pick(schoolObj(pickTeam).phrases)}</div><p class="muted">Analysts, fans and insiders are reacting now. Previous predictions remain in the recruiting history as receipts.</p><button class="btn primary" data-m="close">CONTINUE</button>`),80)}
function breadcrumb(){let open=S.board.filter(x=>!x.commit);if(!open.length)return;let b=pick(open),r=genProspect(b.id-1),lines=[`${r.name}'s teammate posts: “My boy already knows 😂”`,`${r.name}'s high-school coach says relationships will matter more than people think.`,`A booster-connected account posts: “Hearing tomorrow could be a VERY good day for ${pick(b.finalists)}.”`,`${r.name} follows an assistant coach from ${pick(b.finalists)}, then fans immediately notice.`,`National Insider flips a prediction to ${pick(b.finalists)} with HIGH confidence.`];S.social.unshift(`👀 ${pick(lines)}`)}
function simulateLeagueWeek(){for(const t of S.league){if(t.name===S.teamName)continue;let chance=clamp(.5+(t.rating-72)/80,.18,.82);Math.random()<chance?t.w++:t.l++}let ranking=S.league.slice().sort((a,b)=>((b.w-b.l)*12+b.rating)-((a.w-a.l)*12+a.rating)).slice(0,25);ranking.forEach((x,i)=>x.rank=i+1);let me=ranking.find(x=>x.name===S.teamName);if(me)S.rank=me.rank}
function recoverPlayers(){for(const p of S.roster){p.fatigue=clamp(p.fatigue-15+Math.floor(Math.random()*8),0,100);if(p.injury){p.injury.weeks--;if(p.injury.weeks<=0){p.history.unshift(`Returned from ${p.injury.name}`);p.injury=null;p.health=95}else p.health=clamp(p.health+8,0,95)}else p.health=clamp(p.health+3,0,100)}}
function advanceWeek(){let g=getCurrentGame();if(g&&!g.result){toast('Play or simulate this week’s game before advancing.');return}processRecruiting();simulateLeagueWeek();recoverPlayers();breadcrumb();if(!S.tasks.find(x=>x.id==='media')?.done&&Math.random()<.55){tonePrompt();return}S.week++;if(S.week>12){enterPostseason();return}setTasks();save();render()}
function enterPostseason(){S.phase='Postseason';S.week=13;let wins=S.record.w;let msg=wins>=10?'Your team is in the 12-team CFP conversation.':wins>=6?'Your team is bowl eligible.':'Your regular season is complete.';S.inbox.unshift({type:'Postseason',text:msg});S.history.unshift(`${S.year}: Regular season finished ${S.record.w}-${S.record.l}.`);openModal(`<div class="kicker">REGULAR SEASON COMPLETE</div><h2>${S.record.w}-${S.record.l}</h2><p>${msg}</p><button class="btn primary" data-m="advanceOffseason" data-v="awards">CONTINUE TO POSTSEASON SUMMARY</button>`);save();renderTop()}
function advanceOffseason(stage){if(stage==='awards'){let best=S.roster.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,4);openModal(`<h2>Awards & NFL Outlook</h2>${best.map(p=>`<div class="listrow"><b>${p.name}</b><div class="tiny">${p.pos} • ${p.ovr} OVR • ${p.year>=3&&p.ovr>=90?'NFL Draft consideration':'Returning candidate'}</div></div>`).join('')}<button class="btn primary" data-m="advanceOffseason" data-v="development">OFFSEASON DEVELOPMENT</button>`)}else if(stage==='development'){offseasonDevelopment();openModal(`<h2>Offseason Development</h2><p>Development points were earned from potential, work ethic, coaching, facilities and playing time. ${S.devMode==='Automatic'?'The staff allocated all points automatically.':S.devMode==='Hybrid'?'Unmarked players were handled automatically; manual players can be tuned later.':'Points were banked for manual allocation.'}</p><button class="btn primary" data-m="advanceOffseason" data-v="newyear">ADVANCE TO NEXT SEASON</button>`)}else if(stage==='newyear'){newSeason();closeModal();render()}}
function offseasonDevelopment(){for(const p of S.roster){let earned=Math.round((p.devRate+p.workEthic+S.coach.ratings.Development+S.team.attrs.facilities)/18);p.dp+=earned;if(S.devMode!=='Manual'){let gain=Math.min(4,Math.floor(p.dp/8),Math.max(0,p.potential-p.ovr));if(gain>0){p.ovr+=gain;p.dp-=gain*8;for(const k of Object.keys(p.ratings))if(Math.random()<.25)p.ratings[k]=clamp(p.ratings[k]+1,0,99)}}}}
function newSeason(){let leaving=S.roster.filter(p=>p.year>=5||(p.year>=3&&p.ovr>=94&&Math.random()<.55));for(const p of leaving)S.history.unshift(`${p.name} (${p.pos}) left ${S.teamName}${p.ovr>=90?' for the NFL Draft':''}.`);S.roster=S.roster.filter(p=>!leaving.includes(p));for(const p of S.roster){p.year++;p.class=['FR','SO','JR','SR','5YR'][Math.min(4,p.year-1)];p.fatigue=0;p.health=100}for(const s of S.signed){let r=genProspect(s.id-1),a=baseRatings(r.pos,rng(S.seed+s.id+S.year),r.trueAbility),o=calcOvr(r.pos,a);S.roster.push({id:Math.max(0,...S.roster.map(x=>x.id))+1,name:r.name,pos:r.pos,year:1,class:'FR',scholarship:true,ovr:o,arch:r.arch,ratings:a,health:100,fatigue:0,durability:a.Durability,toughness:a.Toughness,potential:r.potential,devRate:55+Math.floor(Math.random()*40),workEthic:50+Math.floor(Math.random()*45),dp:0,stats:{},injury:null,nil:0,traits:[r.arch],history:[`Signed with ${S.teamName} as the #${r.rank} national recruit.`]})}S.year++;S.week=1;S.phase='Regular Season';S.record={w:0,l:0};S.schedule=genSchedule(S.teamName,S.seed+S.year*31);S.league=leagueSnapshot(S.seed+S.year*47);S.board=[];S.signed=[];S.acqHS=0;S.acqPortal=0;S.recruitPoolSeed=S.seed+S.year*67;S.recruitPoints=prestigePoints(S.team.attrs.current);S.history.unshift(`${S.year}: A new season begins.`);setTasks();save();renderTop()}
function cycleDev(){let a=['Automatic','Manual','Hybrid'],i=(a.indexOf(S.devMode)+1)%a.length;S.devMode=a[i];S.settings.devMode=S.devMode;save();render()}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Saturday-Legacy-${S.teamName.replace(/\s+/g,'-')}-${S.year}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importSaveFile(file){let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x||!x.teamName)throw 0;S=x;localStorage.setItem(SAVE_KEY,JSON.stringify(S));launch()}catch(e){alert('That save file could not be imported.')}};rd.readAsText(file)}
function populate(){let sel=document.getElementById('school');let confs=[...new Set(TEAM_DB.map(t=>t.conference))];sel.innerHTML=confs.map(c=>`<optgroup label="${c}">${TEAM_DB.filter(t=>t.conference===c).map(t=>`<option>${t.name}</option>`).join('')}</optgroup>`).join('');if(TEAM_MAP['Penn State'])sel.value='Penn State'}
document.getElementById('newBtn').addEventListener('click',()=>show('setup'));document.getElementById('backBtn').addEventListener('click',()=>show('home'));document.getElementById('startBtn').addEventListener('click',generateDynasty);document.getElementById('continueBtn').addEventListener('click',()=>{S=load();if(S)launch()});document.getElementById('closeModalBtn').addEventListener('click',closeModal);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importSaveFile(e.target.files[0])});
populate();refreshContinue();loadLogos();
</script></body></html>
