<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#071427"><title>Saturday Legacy v0.2</title><style>
:root{--bg:#06111f;--panel:#0d1d31;--panel2:#122741;--line:#25415f;--text:#f5f7fb;--muted:#9db0c6;--gold:#f1c75b;--green:#65d58a;--red:#ff7474;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111f,#081827 55%,#06111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.screen{display:none;min-height:100vh}.screen.on{display:block}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.titlebox{width:min(560px,100%);text-align:center}.logo{font-family:Georgia,serif;font-size:42px;letter-spacing:2px;margin:0}.kicker{color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:800}.sub{color:var(--muted)}button,select,input{font:inherit}.btn{width:100%;padding:15px 16px;margin:7px 0;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:white;font-weight:750;text-align:left}.btn.primary{background:var(--gold);color:#09111b;border-color:var(--gold);text-align:center}.btn.ghost{text-align:center;background:transparent}.btn:active{transform:scale(.99)}.card{background:rgba(13,29,49,.96);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0003}.field{margin:14px 0;text-align:left}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}.field input,.field select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#081728;color:white}.top{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 15px 10px;background:#06111fee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center}.top b{font-size:18px}.rank{color:var(--gold)}main{padding:8px 14px 100px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:1fr;gap:0}.hero{font-size:38px;font-weight:900;margin:5px 0}.tiny{font-size:12px;color:var(--muted)}.meter{height:7px;background:#071321;border-radius:99px;overflow:hidden;margin:7px 0 12px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:99px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;margin:3px 4px 3px 0}.pos{background:#123c2b;color:#8df2b0}.neg{background:#481f28;color:#ff9ca9}.gold{color:var(--gold)}.feed{padding:12px;border-left:3px solid var(--blue);background:#081728;border-radius:9px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#071321f5;border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:9px 1px}.nav button.active{color:var(--gold);font-weight:900}.nav span{display:block;font-size:19px;margin-bottom:3px}.choice{padding:13px;border:1px solid var(--line);background:#10243b;color:white;border-radius:12px;margin:6px 0;width:100%;text-align:left}.choice:hover{border-color:var(--gold)}.pill{font-size:11px;background:#142b46;padding:5px 8px;border-radius:999px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:84vh;overflow:auto;background:#0b1b2e;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.x{float:right;border:0;background:#17304c;color:white;border-radius:50%;width:34px;height:34px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr;gap:12px}.card{margin:6px}.wide{grid-column:1/-1}.nav{left:50%;transform:translateX(-50%);max-width:900px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}.logo{font-size:56px}}
</style></head><body>
<section id="home" class="screen on"><div class="center"><div class="titlebox"><div class="kicker">COLLEGE FOOTBALL DYNASTY SIMULATOR</div><h1 class="logo">SATURDAY<br>LEGACY</h1><p class="sub">Build a program. Build relationships. Build history.</p><button class="btn primary" onclick="newDynasty()">NEW DYNASTY</button><button id="continueBtn" class="btn" onclick="continueDynasty()">CONTINUE DYNASTY</button><button class="btn ghost" onclick="showAbout()">ABOUT v0.2</button><p class="tiny">Mobile prototype • Saves on this browser/device</p></div></div></section>
<section id="setup" class="screen"><div class="center"><div class="titlebox"><div class="kicker">NEW DYNASTY</div><h2>Create Your Coach</h2><div class="card"><div class="field"><label>Coach name</label><input id="coachName" value="Tajee Newkirk"></div><div class="field"><label>Program</label><select id="school"><option>Penn State</option><option>Delaware</option><option>USC</option><option>Alabama</option><option>Oregon</option></select></div><div class="field"><label>Coaching background</label><select id="background"><option>Recruiter</option><option>Offensive Coordinator</option><option>Defensive Coordinator</option><option>Player Developer</option></select></div><div class="field"><label>Media style</label><select id="media"><option>Diplomatic</option><option>Blunt</option><option>Fiery</option><option>Reserved</option></select></div><button class="btn primary" onclick="createDynasty()">BEGIN DYNASTY</button><button class="btn ghost" onclick="goHome()">BACK</button></div></div></div></section>
<section id="game" class="screen"><header class="top"><div><b id="teamName">Penn State</b><div class="tiny"><span id="season">2026 • WEEK 1</span></div></div><div style="text-align:right"><b class="rank" id="teamRank">#9</b><div class="tiny" id="record">0-0</div></div></header><main id="app"></main><nav class="nav" id="nav"></nav></section>
<div class="modal" id="modal"><div class="sheet"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const schools={"Penn State":{prestige:91,nil:84,fan:82,rank:9,expect:"CFP Contender",legacy:"#11 — Legacy Number",theme:"White Out"},"Delaware":{prestige:61,nil:48,fan:68,rank:null,expect:"Build a Winner",legacy:"Program legends carry enormous weight",theme:"Homecoming"},"USC":{prestige:92,nil:88,fan:78,rank:12,expect:"CFP Contender",legacy:"Retired numbers are protected",theme:"Trojan Showcase"},"Alabama":{prestige:99,nil:95,fan:93,rank:3,expect:"National Championship",legacy:"Numbers remain in circulation",theme:"Bryant-Denny Night"},"Oregon":{prestige:94,nil:96,fan:88,rank:5,expect:"National Championship",legacy:"Modern brand + player honors",theme:"Autzen After Dark"}};
let S=null,current='Dashboard';
const basePlayers=[{n:'Rocco Becht',p:'QB',c:'SR',o:88,pot:91,pos:['Cannon Arm','Play Action'],neg:['Holds Ball Too Long']},{n:'Cam Wallace',p:'RB',c:'JR',o:87,pot:90,pos:['One Cut','Home Run Threat'],neg:[]},{n:'Drew Shelton',p:'OT',c:'SR',o:89,pot:89,pos:['Stonewall','Finisher'],neg:['Speed Rush Vulnerability']},{n:'Tony Rojas',p:'LB',c:'SR',o:91,pot:92,pos:['Sideline-to-Sideline','Enforcer'],neg:['Emotional']}];
function fresh(name,school,bg,media){let x=schools[school];return{coach:{name,bg,media,ovr:82,pos:bg==='Recruiter'?['Relationship Builder — Gold','Talent Evaluator — Silver']:bg==='Player Developer'?['Trait Developer — Gold','Fundamentals Teacher — Silver']:bg==='Offensive Coordinator'?['Opening Script — Gold','Scheme Teacher — Silver']:['Coverage Disguise — Gold','Second-Half Adjuster — Silver'],neg:['Conservative With Lead — Moderate']},team:{name:school,...x,momentum:68,record:'0-0'},week:1,year:2026,players:JSON.parse(JSON.stringify(basePlayers)),recruits:[{n:'Kemon Spell',p:'RB',stars:5,rank:5,status:school,interest:73,why:'Winning • NFL Development'},{n:'Maxwell Hiller',p:'OT',stars:5,rank:2,status:'Florida',interest:22,why:'Development • Stability'},{n:'Malik Henderson',p:'LB',stars:5,rank:17,status:school,interest:88,why:'Atmosphere • Tradition'},{n:'Jordan Price',p:'WR',stars:4,rank:71,status:'Uncommitted',interest:64,why:'QB Play • Exposure'}],events:[`${new Date().toLocaleDateString()} — ${name} begins a new dynasty at ${school}.`],promises:[],autosave:true}}
function save(){if(S)localStorage.setItem('saturdayLegacyV02',JSON.stringify(S));refreshContinue()}
function refreshContinue(){document.getElementById('continueBtn').style.display=localStorage.getItem('saturdayLegacyV02')?'block':'none'}
function screens(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}
function newDynasty(){screens('setup')}function goHome(){screens('home');refreshContinue()}function continueDynasty(){let x=localStorage.getItem('saturdayLegacyV02');if(!x)return;S=JSON.parse(x);launch()}
function createDynasty(){S=fresh(coachName.value||'Coach',school.value,background.value,media.value);save();launch()}
function launch(){screens('game');current='Dashboard';renderNav();render()}
const tabs=[['Dashboard','⌂'],['Roster','♟'],['Recruiting','★'],['Staff','♜'],['Scenarios','!'],['History','◷']];
function renderNav(){nav.innerHTML=tabs.map(([t,i])=>`<button class="${t===current?'active':''}" onclick="tab('${t}')"><span>${i}</span>${t}</button>`).join('')}
function tab(t){current=t;renderNav();render()}
function meter(n){return `<div class="meter"><i style="width:${n}%"></i></div>`}function tags(a,c){return a.map(x=>`<span class="tag ${c}">${x}</span>`).join('')}
function render(){teamName.textContent=S.team.name;teamRank.textContent=S.team.rank?'#'+S.team.rank:'NR';record.textContent=S.team.record;season.textContent=`${S.year} • WEEK ${S.week}`;let f=views[current];app.innerHTML=f?f():'';save()}
const views={
Dashboard:()=>`<div class="grid"><section class="card"><span class="pill">${S.team.expect}</span><div class="hero">${S.team.record}</div><div class="sub">Head Coach ${S.coach.name}</div><p>Program Prestige <b>${S.team.prestige}</b></p>${meter(S.team.prestige)}<p>Recruiting Momentum <b>${S.team.momentum}</b></p>${meter(S.team.momentum)}</section><section class="card"><h3>Next Saturday</h3><h2>${S.team.name} vs #3 Ohio State</h2><p class="gold">${S.team.theme.toUpperCase()} • 7:30 PM • NATIONAL TV</p><p class="tiny">14 official visitors • National spotlight</p><button class="choice" onclick="scenario('whiteout')">OPEN GAME-WEEK STORYLINE</button></section><section class="card wide"><h3>Program Inbox</h3><div class="feed"><b>Recruiting:</b> A five-star commit is monitoring the direction of the season.</div><div class="feed"><b>Staff:</b> Coaching-carousel rumors are beginning around your assistants.</div><div class="feed"><b>Locker Room:</b> Playing-time and NIL conversations may emerge as the season develops.</div></section><section class="card wide"><button class="btn primary" onclick="advanceWeek()">ADVANCE WEEK</button></section></div>`,
Roster:()=>`<section class="card"><h2>Roster</h2>${S.players.map((p,i)=>`<div class="listrow" onclick="player(${i})"><div class="row"><div><b>${p.n}</b><div class="tiny">${p.p} • ${p.c}</div></div><div><b>${p.o}</b> OVR<br><span class="tiny">${p.pot} POT</span></div></div>${tags(p.pos,'pos')}${tags(p.neg,'neg')}</div>`).join('')}</section>`,
Recruiting:()=>`<section class="card"><h2>2027 Recruiting Board</h2>${S.recruits.map((r,i)=>`<div class="listrow"><div class="row"><div><b>${'★'.repeat(r.stars)} ${r.n}</b><div class="tiny">${r.p} • #${r.rank} National • ${r.status}</div></div><b>${r.interest}%</b></div>${meter(r.interest)}<div class="tiny">Priorities: ${r.why}</div><button class="choice" onclick="recruit(${i})">CONTACT / REVIEW</button></div>`).join('')}</section>`,
Staff:()=>`<div class="grid"><section class="card"><h2>${S.coach.name}</h2><div class="hero">${S.coach.ovr}</div><div class="tiny">HEAD COACH • ${S.coach.bg} background • ${S.coach.media} media style</div><h4>Strengths</h4>${tags(S.coach.pos,'pos')}<h4>Weakness</h4>${tags(S.coach.neg,'neg')}</section><section class="card"><h3>Assistants</h3><div class="listrow"><b>OC Taylor Mouser</b><div class="tiny">86 OVR • RPO Architect • Stubborn Script</div></div><div class="listrow"><b>DC D'Anton Lynn</b><div class="tiny">89 OVR • Coverage Disguise • Aggressive Risk</div></div><div class="listrow"><b>RB Coach Marcus Reed</b><div class="tiny">83 OVR • Trait Developer • Limited Recruiter</div></div><button class="choice" onclick="scenario('coach')">COACHING-CAROUSEL MEETING</button></section></div>`,
Scenarios:()=>`<section class="card"><h2>Program Conversations</h2><p class="sub">These are prototype versions of the dynamic situations that will eventually emerge from the simulation.</p><button class="choice" onclick="scenario('transfer')"><b>Five Players Request Transfer Meetings</b><br><span class="tiny">NIL • playing time • family • scheme • relationship</span></button><button class="choice" onclick="scenario('coach')"><b>Assistant Receives HC Offer</b><br><span class="tiny">Decide whether he stays through postseason</span></button><button class="choice" onclick="scenario('press')"><b>Portal Press Conference</b><br><span class="tiny">Your tone affects reputation and narratives</span></button><button class="choice" onclick="scenario('whiteout')"><b>Major Recruiting Weekend</b><br><span class="tiny">Game outcome changes visitor reactions</span></button></section>`,
History:()=>`<section class="card"><h2>Program Legacy</h2><div class="feed"><b>${S.team.legacy}</b><br><span class="tiny">School honor philosophy affects jersey retirement, number retirement and future legacy traditions.</span></div><h3>World Timeline</h3>${S.events.map(e=>`<div class="listrow">${e}</div>`).join('')}</section>`};
function openModal(h){modalBody.innerHTML=h;modal.classList.add('on')}function closeModal(){modal.classList.remove('on')}
function player(i){let p=S.players[i];openModal(`<h2>${p.n}</h2><p class="gold">${p.p} • ${p.c} • ${p.o} OVR • ${p.pot} POT</p><h4>Skill Traits</h4>${tags(p.pos,'pos')||'<span class="tiny">No positive traits currently identified.</span>'}<h4>Negative Tendencies</h4>${tags(p.neg,'neg')||'<span class="tiny">No negative traits currently identified.</span>'}<div class="feed"><b>Profile tabs planned:</b><br>Info • Ratings • Stats • Game Log • Awards • Development • Recruiting • NIL • Social • History</div>`)}
function recruit(i){let r=S.recruits[i];openModal(`<h2>${r.n}</h2><p>${'★'.repeat(r.stars)} ${r.p} • #${r.rank} National</p><p>Interest: <b>${r.interest}%</b></p>${meter(r.interest)}<p class="tiny">Priorities: ${r.why}</p><button class="choice" onclick="recruitAction(${i},'relationship')">BUILD RELATIONSHIP</button><button class="choice" onclick="recruitAction(${i},'visit')">PITCH ${S.team.theme.toUpperCase()} VISIT</button><button class="choice" onclick="recruitAction(${i},'promise')">MAKE PLAYING-TIME PROMISE</button>`)}
function recruitAction(i,a){let r=S.recruits[i],gain=a==='visit'?7:a==='promise'?9:4;r.interest=Math.min(100,r.interest+gain);if(a==='promise')S.promises.push({to:r.n,text:'Opportunity to compete early',kept:null});S.events.unshift(`${S.year} W${S.week} — ${S.coach.name} strengthened the relationship with ${r.n}${a==='promise'?' and made a tracked promise':''}.`);save();closeModal();render()}
function scenario(type){if(type==='transfer'){let rs=[['WR2','NIL valuation is below his perceived market.'],['QB2','Believes he can start immediately at a smaller program such as Delaware.'],['Safety','Wants to move closer to family.'],['Linebacker','Does not believe the defensive scheme fits him.'],['CB1','Relationship with the head coach has deteriorated.']];openModal(`<h2>⚠️ Five Players Request Meetings</h2><p class="sub">Each player has a different reason. Some decisions may already be final.</p>${rs.map((x,i)=>`<div class="feed"><b>${x[0]}</b><br>${x[1]}<button class="choice" onclick="transferChoice(${i},'retain')">TRY TO KEEP HIM</button><button class="choice" onclick="transferChoice(${i},'wish')">WISH HIM THE BEST</button><button class="choice" onclick="transferChoice(${i},'cold')">HE'S NO LONGER WITH THE PROGRAM</button></div>`).join('')}`)}
if(type==='coach')openModal(`<h2>OC Offered Kentucky HC Job</h2><p>Your offensive coordinator says he intends to accept Kentucky's head-coaching job. ${S.team.name} is preparing for the postseason.</p><button class="choice" onclick="decision('OC will coach through the postseason. Continuity improves, but divided-focus risk remains.')">LET HIM COACH THROUGH THE PLAYOFF/BOWL</button><button class="choice" onclick="decision('OC was released after the regular season. An interim coordinator takes over.')">ONCE REGULAR SEASON ENDS, HE CAN GO</button><button class="choice" onclick="decision('A retention offer was made with a raise and more autonomy. His ambition may still win out.')">TRY TO KEEP HIM</button>`);
if(type==='press')openModal(`<h2>Press Conference</h2><p><b>Reporter:</b> Five players entered the portal today. Were you surprised by the number of departures?</p><button class="choice" onclick="decision('Coach publicly wished the departing players the best. Player-family trust rises.')">“They have to make the best decisions for their futures. I wish them well.”</button><button class="choice" onclick="decision('Coach gave a professional, neutral response to the portal departures.')">“They decided to pursue opportunities elsewhere. We wish them luck.”</button><button class="choice" onclick="decision('Coach said the players are no longer with the program. Reporters begin digging into the departures.')">“They’re no longer members of this program. I’m focused on the players who are.”</button>`);
if(type==='whiteout')openModal(`<h2>${S.team.theme} Recruiting Weekend</h2><p>Fourteen official visitors are in attendance. The result will affect each recruit differently based on priorities and existing relationships.</p><button class="choice" onclick="gameResult('win')">STATEMENT WIN — 38–17</button><button class="choice" onclick="gameResult('close')">CLOSE LOSS — 31–28</button><button class="choice" onclick="gameResult('bad')">BLOWOUT LOSS — 52–10</button>`)}
function transferChoice(i,a){let outcomes={retain:'A retention conversation was held. Outcome depends on motive, trust, NIL and role.',wish:'The departure was handled respectfully. Player-relations reputation improves.',cold:'The player was told he is no longer with the program. Media speculation increases.'};decision(outcomes[a])}
function decision(text){S.events.unshift(`${S.year} W${S.week} — ${text}`);save();closeModal();render()}
function gameResult(a){if(a==='win'){S.team.record='1-0';S.team.momentum=Math.min(100,S.team.momentum+12);S.recruits[0].interest=Math.min(100,S.recruits[0].interest+9);S.recruits[2].interest=Math.min(100,S.recruits[2].interest+7);decision(`${S.team.name} won 38–17 in a statement game. Recruiting momentum surged.`)}else if(a==='close'){S.team.record='0-1';S.recruits[2].interest=Math.min(100,S.recruits[2].interest+2);decision(`${S.team.name} lost 31–28. Atmosphere-focused visitors still graded the trip highly.`)}else{S.team.record='0-1';S.team.momentum=Math.max(0,S.team.momentum-13);S.recruits[0].interest=Math.max(0,S.recruits[0].interest-10);decision(`${S.team.name} lost 52–10. Recruiting stability and fan confidence took a hit.`)}}
function advanceWeek(){S.week++;if(S.week>15){S.week=1;S.year++;}S.events.unshift(`${S.year} W${S.week} — Week advanced. New conversations and storylines can emerge.`);render()}
function showAbout(){openModal(`<h2>Saturday Legacy v0.2</h2><p>This mobile-first prototype establishes the dynasty shell: new dynasty setup, school/coach identity, local saves, roster traits, recruiting relationships, coaching strengths/weaknesses, transfer conversations, assistant departures, press responses and program history.</p><p class="tiny">The full game engine, schedules, play-by-play simulation, complete databases and multi-season progression are future build stages.</p>`)}
refreshContinue();
</script></body></html>
