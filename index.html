function pipelineStates(){let st=venueFor(S.teamName).state;let regional={PA:['PA','NJ','MD','OH'],OH:['OH','PA','MI','IN'],TX:['TX','OK','LA'],FL:['FL','GA','AL'],CA:['CA','AZ','NV'],GA:['GA','FL','AL','SC'],AL:['AL','GA','MS','FL']}[st]||[st];return regional}
function recruitRow(p){let onBoard=S.board.some(x=>x.id===p.id),rel=p.dream===S.teamName?'Dream School':p.myInterestRank<=3?'Top 3':p.myInterestRank<=5?'Top 5':p.myInterestRank<=10?'Top 10':'Outside Top 10';return `<div class="listrow recruitRow" data-rank="${p.rank}"><div class="row"><div><b>#${p.rank} ${p.name}</b><div class="tiny">${stars(p.stars)} ${p.pos} • ${p.arch} • ${p.state}</div><div class="micro">${rel} • ${p.stage}</div></div><div style="text-align:right"><b>${p.rating}</b><div class="micro">${onBoard?'ON BOARD':'VIEW'}</div></div></div></div>`}
function boardPane(){if(!S.board.length)return `<div class="card"><div class="sectiontitle">MY RECRUITING BOARD</div><div class="empty">No active targets. Add players from National Rankings.</div></div>`;return `<div class="card"><div class="row"><div><div class="sectiontitle">MY RECRUITING BOARD</div><div class="tiny">${S.board.length}/50 active targets • ${S.recruitPoints} weekly points</div></div></div>${S.board.map(x=>{let p=genProspect(+x.id.slice(1));return `<div class="listrow recruitRow" data-rank="${p.rank}"><div class="row"><div><b>#${p.rank} ${p.name}</b><div class="tiny">${p.pos} • ${p.state} • ${p.stage}</div><div class="micro">${boardStanding(p)} • Momentum ${x.momentum>0?'▲':x.momentum<0?'▼':'—'} • Visit ${visitLabel(p.id)}</div></div><div style="text-align:right"><b>${x.points||0} pts</b><div class="micro">${x.offer?'OFFERED':'NO OFFER'}</div></div></div></div>`}).join('')}</div>`}
function boardStanding(p){let i=p.interests.indexOf(S.teamName);return i===0?'Leader':i===1?'Neck-and-Neck':i<=3?'Strong Contender':i<=7?'In Mix':'Outside Looking In'}
function visitLabel(id){let v=S.visits.find(x=>x.recruitId===id);return v?`Week ${v.week}`:'None'}
function classPane(){return `<div class="card"><div class="sectiontitle">COMMITMENTS / CLASS</div><div class="row"><div><div class="hero">${S.commitments.length}</div><div class="tiny">commits</div></div><div style="text-align:right"><b>${S.commitments.reduce((s,x)=>s+x.stars,0)} total stars</b><div class="tiny">Class rank updates nationally</div></div></div>${S.commitments.map(x=>`<div class="listrow"><b>${stars(x.stars)} ${x.pos} ${x.name}</b><div class="tiny">#${x.rank} National • ${x.state} • ${x.arch}</div></div>`).join('')||'<div class="empty">No commitments yet.</div>'}</div>`}
function needsPane(){let groups=POSITIONS.map(pos=>{let ps=S.roster.filter(p=>p.pos===pos),c={FR:0,SO:0,JR:0,SR:0},loss=0;for(const p of ps){if(p.year==='FR')c.FR++;else if(p.year==='SO')c.SO++;else if(p.year==='JR'){c.JR++;if(p.ovr>=88)loss+=.55}else{c.SR++;loss+=1}if(p.transferRisk>55)loss+=.35}let incoming=S.commitments.filter(x=>x.pos===pos).length,returning=ps.length-loss+incoming,target=POS_TARGETS[pos]||4,ratio=returning/target,need=ratio<.65?'Critical':ratio<.85?'High':ratio<1?'Moderate':'Low',cls=need==='Critical'?'need-red':need==='High'?'need-orange':need==='Moderate'?'need-yellow':'need-green';return{pos,c,total:ps.length,loss:Math.round(loss*10)/10,incoming,need,cls}});return `<div class="card"><div class="sectiontitle">TEAM NEEDS</div><div class="tiny">Projected losses include seniors, likely early NFL declarations, and elevated transfer risk.</div><div class="tableWrap"><table class="table"><thead><tr><th>Pos</th><th>FR</th><th>SO</th><th>JR</th><th>SR/GR</th><th>Total</th><th>Proj Loss</th><th>Need</th></tr></thead><tbody>${groups.map(g=>`<tr class="needRow" data-pos="${g.pos}"><td><b>${g.pos}</b></td><td>${g.c.FR}</td><td>${g.c.SO}</td><td>${g.c.JR}</td><td>${g.c.SR}</td><td>${g.total}</td><td>${g.loss}</td><td class="${g.cls}">${g.need}</td></tr>`).join('')}</tbody></table></div></div>`}
function gamesView(){let g=getCurrentGame();return `<div class="tabs"><button class="on" data-gametab="my">My Game</button><button data-gametab="national">National Scoreboard</button><button data-gametab="tv">Viewership</button></div><div id="gamesPane">${myGamesPane()}</div>`}
function myGamesPane(){if(S.phase==='Preseason')return scheduleBuilder();let g=getCurrentGame();let sched=S.schedule.map(x=>scheduleRow(x)).join('');return `${g?`<div class="card"><div class="sectiontitle">THIS WEEK</div>${matchupCard(g)}<button class="btn primary" data-opengame="1">OPEN GAME CENTER</button></div>`:''}<div class="card"><div class="sectiontitle">SCHEDULE</div>${sched}</div>`}
function scheduleRow(g){let l=S.league.teams[g.opponent],rec=l?`${l.w}-${l.l}`:'0-0',rt=teamRatings(g.opponent);return `<div class="scheduleGame"><div class="tiny">W${g.week}</div><div>${teamSummaryCard(g.opponent)}<div class="micro">${g.home?'HOME':'AWAY'} • ${g.network} • ${g.theme||'No theme'}</div></div><div style="text-align:right"><b>${g.played?`${g.userScore}-${g.oppScore}`:`${rt.ovr} OVR`}</b><div class="micro">${g.played?g.result:rec}</div></div></div>`}
function matchupCard(g){let u=teamRatings(S.teamName,S.roster,S.depth),o=teamRatings(g.opponent),l=S.league.teams[g.opponent],rec=l?`${l.w}-${l.l}`:'0-0';return `<div class="matchup"><div>${logoHtml(S.teamName,'logoLarge')}<div><b>${S.teamName}</b></div><div class="tiny">${S.record.w}-${S.record.l}</div><div class="rating">${u.ovr}</div><div class="micro">OFF ${u.off} • DEF ${u.def} • ST ${u.st}</div></div><div><b>${g.home?'VS':'AT'}</b><div class="tiny">${g.network}<br>${g.time}</div></div><div>${logoHtml(g.opponent,'logoLarge')}<div><b>${l?.rank?`#${l.rank} `:''}${g.opponent}</b></div><div class="tiny">${rec}${(l?.cw+l?.cl)>0?` • ${l.cw}-${l.cl} ${confName(g.opponent)}`:''}</div><div class="rating">${o.ovr}</div><div class="micro">OFF ${o.off} • DEF ${o.def} • ST ${o.st}</div></div></div>`}
function scheduleBuilder(){let slots=nonConfSlots(S.teamName),selected=S.scheduleDraft||[],cands=validNonConfOpps(S.teamName).sort((a,b)=>schoolObj(b.name).attrs.current-schoolObj(a.name).attrs.current);return `<div class="card"><div class="sectiontitle">PRESEASON SCHEDULE BUILDER</div><div class="tiny">${confName(S.teamName)==='Big Ten'?'Big Ten: 3 nonconference games, then 9 conference games.':'4 nonconference games, then 8 conference games.'} Rivalry Week is protected in Week 12.</div><div class="row"><b>${selected.length}/${slots} nonconference games selected</b><button class="btn small" id="clearSchedule">CLEAR</button></div>${selected.map((x,i)=>`<div class="listrow"><div class="row"><span>Week ${i+1}: <b>${x.opponent}</b></span><button class="btn small removeSched" data-opp="${x.opponent}">REMOVE</button></div></div>`).join('')}<div class="sectiontitle">AVAILABLE OPPONENTS</div>${cands.map(t=>{let ch=acceptanceChance(S.teamName,t.name,true),rt=teamRatings(t.name);return `<div class="listrow"><div class="row"><div><b>${t.name}</b><div class="tiny">${confName(t.name)} • ${rt.ovr} OVR • ${teamTier(t.name)}</div></div><div style="text-align:right"><b>${ch}%</b><div class="micro">schedule acceptance</div><button class="btn small requestGame" data-opp="${t.name}" ${selected.length>=slots||selected.some(x=>x.opponent===t.name)?'disabled':''}>REQUEST</button></div></div></div>`}).join('')}<button class="btn primary" id="finalizeSchedule" ${selected.length!==slots?'disabled':''}>FINALIZE SCHEDULE & GAME THEMES</button></div>`}
function nationalPaneGames(){let games=S.league.weekGames[S.week]||[];if(!games.length)return `<div class="card"><div class="empty">National games populate when the week begins.</div></div>`;return `<div class="card"><div class="sectiontitle">NATIONAL SCOREBOARD — WEEK ${S.week}</div>${games.map(g=>`<div class="listrow"><div class="row"><div><b>${g.away} ${g.awayScore??''} @ ${g.home} ${g.homeScore??''}</b><div class="tiny">${g.network} • ${g.time} • ${g.gotw?'🇺🇸 AMERICA’S GAME OF THE WEEK':''}</div></div><div style="text-align:right"><b>${g.played?'FINAL':'UPCOMING'}</b><div class="micro">${g.viewers?g.viewers.toFixed(1)+'M avg':''}</div></div></div></div>`).join('')}</div>`}
function tvPane(){let games=Object.values(S.league.weekGames).flat().filter(g=>g.played&&g.viewers).sort((a,b)=>b.viewers-a.viewers);return `<div class="card"><div class="sectiontitle">VIEWERSHIP LEADERS</div>${games.slice(0,30).map((g,i)=>`<div class="listrow"><b>${i+1}. ${g.away} @ ${g.home}</b><div class="tiny">${g.network} • ${g.viewers.toFixed(1)}M avg • ${g.peakViewers.toFixed(1)}M peak ${g.gotw?'• America’s Game of the Week':''}</div></div>`).join('')||'<div class="empty">Viewership posts after games are played.</div>'}</div>`}
function moreView(){return `<div class="card"><div class="sectiontitle">DYNASTY</div><button class="btn" data-more="Rankings">Rankings & CFP</button><button class="btn" data-more="Awards">Awards</button><button class="btn" data-more="Media">Media / Press</button><button class="btn" data-more="Social">Social Feed</button><button class="btn" data-more="Staff">Staff & Play Calling</button><button class="btn" data-more="Program">Program</button><button class="btn" data-more="Draft">NFL Draft History</button><button class="btn" data-more="History">History</button><button class="btn" id="exportBtn">EXPORT SAVE</button></div>`}
function bindView(){document.querySelectorAll('.taskBtn').forEach(b=>b.onclick=()=>{let d=b.dataset.dest;if(d==='Media')openMedia();else{current=d;renderNav();render()}});let adv=document.getElementById('advanceBtn');if(adv)adv.onclick=advance;document.querySelectorAll('[data-rtab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-rtab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('rosterPane').innerHTML=rosterPane(b.dataset.rtab);bindView()});let ad=document.getElementById('autoDepthBtn');if(ad)ad.onclick=()=>{S.depth=autoDepth(S.roster);save();render()};document.querySelectorAll('.depthSelect').forEach(s=>s.onchange=()=>{let slot=S.depth[s.dataset.pos].find(x=>x.role===s.dataset.role);slot.playerId=s.value;save();toast('Depth chart updated.')});document.querySelectorAll('.playerRow').forEach(x=>x.onclick=()=>openPlayer(x.dataset.pid));document.querySelectorAll('[data-rectab]').forEach(b=>b.onclick=()=>{recruitTab=b.dataset.rectab;render()});['fStars','fPos','fArch','fState','fRel'].forEach(id=>{let e=document.getElementById(id);if(e)e.onchange=()=>{S.recFilters={stars:fStars.value,pos:fPos.value,arch:fArch.value,state:fState.value,relation:fRel.value};nationalPage=0;save();render()}});let pr=document.getElementById('prevRecruit');if(pr)pr.onclick=()=>{nationalPage=Math.max(0,nationalPage-1);render()};let nr=document.getElementById('nextRecruit');if(nr)nr.onclick=()=>{nationalPage=Math.min(Math.floor(TOTAL_RECRUITS/100),nationalPage+1);render()};document.querySelectorAll('.recruitRow').forEach(x=>x.onclick=()=>openRecruit(+x.dataset.rank));document.querySelectorAll('.needRow').forEach(x=>x.onclick=()=>{S.recFilters={stars:'all',pos:x.dataset.pos,arch:'all',state:'all',relation:'all'};recruitTab='National';render()});document.querySelectorAll('.requestGame').forEach(b=>b.onclick=()=>requestGame(b.dataset.opp));document.querySelectorAll('.removeSched').forEach(b=>b.onclick=()=>{S.scheduleDraft=S.scheduleDraft.filter(x=>x.opponent!==b.dataset.opp);save();render()});let cs=document.getElementById('clearSchedule');if(cs)cs.onclick=()=>{S.scheduleDraft=[];save();render()};let fs=document.getElementById('finalizeSchedule');if(fs)fs.onclick=finalizeSchedule;document.querySelectorAll('[data-opengame]').forEach(b=>b.onclick=openGameCenter);document.querySelectorAll('[data-gametab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-gametab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('gamesPane').innerHTML=b.dataset.gametab==='national'?nationalPaneGames():b.dataset.gametab==='tv'?tvPane():myGamesPane();bindView()});document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>openMore(b.dataset.more));let ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportSave}
function requestGame(opp){let chance=acceptanceChance(S.teamName,opp,true),roll=Math.random()*100;if(roll<=chance){S.scheduleDraft.push({opponent:opp});S.social.unshift({type:'analyst',author:'Schedule Insider',text:`${opp} accepted a nonconference game with ${S.teamName}.`,week:0});toast(`${opp} accepted the game.`)}else{S.social.unshift({type:'insider',author:'Schedule Insider',text:`${opp} declined ${S.teamName}'s scheduling request. Playoff risk and schedule strategy were factors.`,week:0});toast(`${opp} declined the request.`)}save();render()}
function finalizeSchedule(){let slots=nonConfSlots(S.teamName);if(S.scheduleDraft.length!==slots)return;S.schedule=buildConferenceSchedule(S.teamName,S.seed+80,S.scheduleDraft.map(x=>x.opponent));for(const g of S.schedule)g.rivalry=g.opponent===primaryRival(S.teamName);preassignThemes(S.schedule,S.teamName);S.scheduleFinalized=true;save();openThemePlanner()}
function openThemePlanner(){let homes=S.schedule.filter(g=>g.home);openModal(`<h2>Preseason Event Planner</h2><div class="tiny">Homecoming, Military Appreciation, and Stripe Out are fixed once the season starts. ${S.teamName==='Penn State'?'White Out':'Marquee Game'} may be moved later if the original matchup loses importance.</div>${homes.map(g=>`<div class="listrow"><b>Week ${g.week} vs ${g.opponent}</b><div class="tiny">${g.theme||'No theme'} ${g.fixedTheme?'• LOCKED':''}</div>${!g.fixedTheme?`<button class="btn small themeMove" data-week="${g.week}">SET ${S.teamName==='Penn State'?'WHITE OUT':'MARQUEE'}</button>`:''}</div>`).join('')}<button class="btn primary" id="closeTheme">DONE</button>`);document.querySelectorAll('.themeMove').forEach(b=>b.onclick=()=>{let theme=S.teamName==='Penn State'?'White Out':'Marquee Game';S.schedule.forEach(g=>{if(g.theme===theme&&!g.fixedTheme)g.theme=null});let g=S.schedule.find(x=>x.week===+b.dataset.week);g.theme=theme;save();openThemePlanner()});document.getElementById('closeTheme').onclick=closeModal}
function openPlayer(id){let p=S.roster.find(x=>x.id===id);if(!p)return;updateDraftProjection(p);let s=p.stats.season,c=p.stats.career;openModal(`<h2>${p.pos} ${p.name}</h2><div class="row"><div><b>${p.year} • ${p.arch}</b><div class="tiny">${p.height}' • ${p.weight} lb</div></div><div class="rating">${p.ovr} OVR</div></div><div class="card"><div class="sectiontitle">DRAFT PROJECTION</div><b>${p.draftProjection}</b><div class="tiny">Stock reflects performance, traits, production, health, awards, and position value.</div></div><div class="tabs"><button class="on ptab" data-ptab="stats">Stats</button><button class="ptab" data-ptab="ratings">Ratings</button><button class="ptab" data-ptab="health">Health</button><button class="ptab" data-ptab="history">History</button></div><div id="pPane">${playerStatsHtml(p)}</div>`);document.querySelectorAll('.ptab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('pPane').innerHTML=b.dataset.ptab==='ratings'?`<div class="attrgrid">${Object.entries(p.ratings).map(([k,v])=>`<div class="attr">${k}<b>${v}</b></div>`).join('')}</div>`:b.dataset.ptab==='health'?`<div class="card"><div class="statline"><span>Health</span><b>${p.health}%</b></div><div class="statline"><span>Fatigue</span><b>${p.fatigue}</b></div><div class="statline"><span>Durability</span><b>${p.durability}</b></div><div class="statline"><span>Toughness</span><b>${p.toughness}</b></div></div>`:b.dataset.ptab==='history'?`<div class="card"><div class="sectiontitle">AWARDS / HISTORY</div>${p.awards.map(x=>`<div class="listrow">${x}</div>`).join('')||'<div class="empty">No honors yet.</div>'}${draftHistoryFor(p)}</div>`:playerStatsHtml(p)})}
function playerStatsHtml(p){let s=p.stats.season,c=p.stats.career;return `<div class="card"><div class="sectiontitle">SEASON STATS</div><div>${formatPlayerStats(p)}</div></div><div class="card"><div class="sectiontitle">CAREER</div><div>${careerStatsText(p)}</div></div><div class="card"><div class="sectiontitle">GAME LOG</div>${p.stats.games.slice().reverse().map(g=>`<div class="listrow"><b>Week ${g.week} vs ${g.opp}</b><div class="tiny">${g.line}</div></div>`).join('')||'<div class="empty">No games recorded yet.</div>'}</div>`}
function careerStatsText(p){let s=p.stats.career;if(p.pos==='QB')return `${s.passYds} pass yds • ${s.passTD} TD • ${s.int} INT`;if(['RB','FB'].includes(p.pos))return `${s.rushYds} rush yds • ${s.rushTD} TD`;if(['WR','TE'].includes(p.pos))return `${s.rec} rec • ${s.recYds} yds • ${s.recTD} TD`;if(['EDGE','DT','LB','CB','S'].includes(p.pos))return `${s.tackles} tackles • ${s.sacks} sacks • ${s.picks} INT`;return `${s.games} games`}
function draftHistoryFor(p){let d=S.draft.results.find(x=>x.playerId===p.id);return d?`<div class="listrow"><b>${d.round?'Drafted Round '+d.round+', Pick '+d.pick:'Undrafted'}</b><div class="tiny">${S.year} NFL Draft</div></div>`:''}
function updateDraftProjection(p){let s=statScore(p),base=p.ovr+(p.year==='JR'||p.year==='SR'||p.year==='GR SR'?3:0)+Math.min(8,s/90);if(base>=96)p.draftProjection='Round 1 • Top 10';else if(base>=92)p.draftProjection='Round 1';else if(base>=88)p.draftProjection='Rounds 2–3';else if(base>=84)p.draftProjection='Rounds 4–5';else if(base>=80)p.draftProjection='Rounds 6–7';else p.draftProjection='Not projected'}

function advance(){if(S.phase==='Preseason'){if(!S.scheduleFinalized){toast('Build and finalize your nonconference schedule first.');current='Games';renderNav();render();return}S.phase='Regular Season';S.week=1;generateNationalWeek(S.week);setTasks();save();render();return}if(S.phase==='Regular Season'){let g=getCurrentGame();if(g&&!g.played){toast('Play or simulate this week’s game before advancing.');current='Games';renderNav();render();return}processRecruiting();recoverPlayers();if(S.week>=12){enterPostseason();save();render();return}S.week++;generateNationalWeek(S.week);setTasks();save();render();return}if(S.phase==='Postseason'){advancePostseason();save();render();return}if(S.phase==='Offseason'){advanceOffseason();save();render();return}}

function recoverPlayers(){for(const p of S.roster){p.fatigue=Math.max(0,p.fatigue-20);p.health=Math.min(100,p.health+Math.round(4+p.durability/25))}}

function generateBowls(playoffTeams){let eligible=TEAM_DB.filter(t=>!playoffTeams.includes(t.name)&&S.league.teams[t.name].w>=6).sort((a,b)=>S.league.teams[b.name].w-S.league.teams[a.name].w);let bowls=[],names=['Citrus Bowl','Alamo Bowl','Holiday Bowl','ReliaQuest Bowl','Music City Bowl','Duke’s Mayo Bowl','Liberty Bowl','Sun Bowl','Pinstripe Bowl','Las Vegas Bowl','Military Bowl','Birmingham Bowl','Texas Bowl','Gator Bowl'];for(let i=0;i+1<eligible.length&&bowls.length<names.length;i+=2)bowls.push({name:names[bowls.length],a:eligible[i].name,b:eligible[i+1].name,played:false,result:null});return bowls}
function simPostResult(a,b,homeAdv=0){let A=teamRatings(a),B=teamRatings(b),diff=(A.ovr-B.ovr)*.72+homeAdv+(Math.random()-.5)*15,as=clamp(Math.round(28+diff/2+(Math.random()-.5)*8),7,59),bs=clamp(Math.round(28-diff/2+(Math.random()-.5)*8),7,59);if(as===bs)as+=3;return{a,b,aScore:as,bScore:bs,winner:as>bs?a:b,loser:as>bs?b:a}}
function addPostseasonUserGame(opp,home,label,week){S.schedule=S.schedule.filter(g=>!(g.postseason&&g.week===week));let g=makeScheduleGame(week,opp,false,S.seed+S.year+week*77);g.home=home;g.postseason=true;g.postseasonLabel=label;g.network='ESPN';g.time='7:30 PM';g.theme=label.includes('Championship')?'National Championship':label;S.schedule.push(g);S.schedule.sort((a,b)=>a.week-b.week);return g}

function settlePostRound(stage,games){let out=[];for(const gm of games){if(gm.a===S.teamName||gm.b===S.teamName){let sg=S.schedule.find(x=>x.postseason&&x.week===S.week&&x.postseasonLabel===stage);if(!sg||!sg.played)return null;let userWon=sg.result==='W';out.push({a:gm.a,b:gm.b,aScore:gm.a===S.teamName?sg.userScore:sg.oppScore,bScore:gm.b===S.teamName?sg.userScore:sg.oppScore,winner:userWon?S.teamName:(gm.a===S.teamName?gm.b:gm.a),loser:userWon?(gm.a===S.teamName?gm.b:gm.a):S.teamName});}

function finalizeAwards(){updateAwardWatch();let hw=S.awards.watch['Heisman Trophy']?.[0];if(hw)S.awards.winners['Heisman Trophy']=`${hw.name} — ${hw.team}`;let bestByPos={};for(const p of S.roster){let sc=statScore(p)+p.ovr;if(!bestByPos[p.pos]||sc>bestByPos[p.pos].sc)bestByPos[p.pos]={p,sc}}let map={'QB':'Davey O’Brien Award','RB':'Doak Walker Award','WR':'Biletnikoff Award','TE':'John Mackey Award','IOL':'Rimington Trophy','LB':'Butkus Award','CB':'Jim Thorpe Award','K':'Lou Groza Award','P':'Ray Guy Award'};for(const [pos,a] of Object.entries(map)){let x=bestByPos[pos];if(x&&x.sc>135){S.awards.winners[a]=`${x.p.name} — ${S.teamName}`;x.p.awards.push(`${S.year} ${a}`)}}S.awards.allAmerica=Object.values(bestByPos).sort((a,b)=>b.sc-a.sc).slice(0,11).map((x,i)=>`${i<5?'First-Team':'Second-Team'} All-American — ${x.p.pos} ${x.p.name}, ${S.teamName}`);for(const txt of S.awards.allAmerica){let n=txt.split(' — ')[1]?.split(',')[0]?.replace(/^\w+ /,'');let p=S.roster.find(x=>txt.includes(x.name));if(p)p.awards.push(`${S.year} ${txt.split(' — ')[0]}`)}}
const OFFSEASON_STEPS=['Awards & Honors','NFL Draft Decisions','Transfer Portal / Retention','Recruiting & Signing','Coaching Carousel','Offseason Development','Position Changes','NFL Combine / Pro Day','NFL Draft','Roster Compliance','Fall Camp / Depth Chart','Preseason Schedule & Game Themes'];

function draftDecisions(){S.draft.declared=[];for(const p of S.roster){updateDraftProjection(p);let chance=0;if(p.year==='GR SR')chance=1;else if(p.year==='SR')chance=p.ovr>=92?.38:p.ovr>=88?.16:.03;else if(p.year==='JR')chance=p.ovr>=94?.65:p.ovr>=91?.32:p.ovr>=88?.08:0;if(Math.random()<chance)S.draft.declared.push(p.id)}}

function confGamesCount(team){let c=confName(team);if(c==='Independent'||c==='FBS Independents')return 0;if(c==='Big Ten')return 9;if(['SEC','ACC','Big 12'].includes(c))return 8;return 8}

function validNonConfOpps(team){let c=confName(team);if(c==='Independent'||c==='FBS Independents')return TEAM_DB.filter(t=>t.name!==team);return TEAM_DB.filter(t=>t.name!==team&&confName(t.name)!==c)}
function buildConferenceSchedule(team,seed,nonconf){
  let r=rng(seed),c=confName(team),isIndependent=c==='Independent'||c==='FBS Independents',rival=primaryRival(team),games=[];
  if(isIndependent){let wk=1;for(const o of nonconf.slice(0,12))games.push(makeScheduleGame(wk++,o,false,seed+wk));while(games.length<12){let pool=TEAM_DB.filter(t=>t.name!==team&&!games.some(g=>g.opponent===t.name)),o=pick(pool,r).name;games.push(makeScheduleGame(wk++,o,false,seed+wk));}}
  else{
    let members=TEAM_DB.filter(t=>t.name!==team&&confName(t.name)===c&&t.name!==rival);for(let i=members.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[members[i],members[j]]=[members[j],members[i]]}
    let cg=confGamesCount(team),confOpps=members.slice(0,Math.max(0,cg-(rival&&confName(rival)===c?1:0))).map(x=>x.name);if(rival&&confName(rival)===c)confOpps.push(rival);
    let wk=1;for(const o of nonconf.slice(0,12-cg))games.push(makeScheduleGame(wk++,o,false,seed+wk));for(const o of confOpps)games.push(makeScheduleGame(wk++,o,true,seed+100+wk));
  }
  let targetHome=isIndependent?7+Math.floor(r()*4):5+Math.floor(r()*3),neutralCount=r()<.28?1:0,idx=[...games.keys()];for(let i=idx.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}games.forEach(g=>{g.home=false;g.neutral=false});for(let i=0;i<Math.min(targetHome,games.length);i++)games[idx[i]].home=true;
  if(neutralCount&&games.length){let ng=games.find(g=>!g.conference&&!g.home)||games.find(g=>!g.home);if(ng){ng.neutral=true;ng.home=false;ng.neutralSite=pick(NEUTRAL_SITES,r)}}
  if(!isIndependent){let rg=games.find(g=>g.opponent===rival);if(rg){let others=games.filter(g=>g!==rg);others.sort((a,b)=>a.week-b.week).forEach((g,i)=>g.week=i+1);rg.week=12;games=[...others,rg]}}
  else games.forEach((g,i)=>g.week=i+1);
  return games.sort((a,b)=>a.week-b.week);
}
